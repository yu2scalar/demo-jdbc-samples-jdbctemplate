spring.application.name=demo-jdbc-samples-jdbctemplate
# Database: profile "postgresql" (default) or "oracle" (application-<profile>.properties)
spring.profiles.default=postgresql

# Every transaction runs in READ COMMITTED (the default of both databases, set explicitly)
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.auto-commit=false
# Connection pool size; can be overridden in application-<profile>.properties
spring.datasource.hikari.maximum-pool-size=20

# Same retry settings as the ScalarDB version
retry.initial-delay-ms=100
retry.max-attempts=3
retry.max-delay-ms=5000
retry.multiplier=2.0
