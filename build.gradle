plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
	// ScalarDB Native JDBC is not on Maven Central yet: build it and publish it to ~/.m2
	// (scalardb-native-jdbc: ./gradlew :driver:publishToMavenLocal)
	mavenLocal()
}

dependencies {
	
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.modelmapper:modelmapper:3.2.2'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
    // jdbc:scalardb-native:... URLs (profiles snj-postgresql / snj-oracle); wraps the drivers above
    runtimeOnly 'com.scalar-labs:scalardb-native-jdbc:3.20.0-beta.1-SNAPSHOT'
}

tasks.named('test') {
	useJUnitPlatform()
}
